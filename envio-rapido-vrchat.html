<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envio Rápido — VRChat / GeForce Now</title>
<style>
  :root{
    --bg:#14151c;
    --surface:#1c1e28;
    --surface-2:#262838;
    --border:#34374a;
    --text:#e9e8f2;
    --text-dim:#9497ad;
    --accent:#9b8cf2;
    --accent-2:#7a6bd9;
    --success:#4ade80;
    --error:#f87171;
    --warning:#fbbf24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:460px;margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:1.3rem;font-weight:650;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--text-dim);font-size:0.88rem;line-height:1.4;margin:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
  }

  /* timer */
  .timer-card{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .timer-display{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:0.02em;}
  .timer-display.warn{color:var(--warning);}
  .timer-display.danger{color:var(--error);}
  .timer-actions{display:flex;gap:8px;}
  .timer-label{font-size:0.75rem;color:var(--text-dim);margin-bottom:2px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:9px;
    font-size:0.85rem;
    font-weight:550;
    padding:9px 14px;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:#2f3244;}
  .btn-accent{background:var(--accent);color:#141225;}
  .btn-accent:hover{background:var(--accent-2);color:#fff;}
  .btn-accent:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:6px 10px;font-size:0.75rem;}

  /* setup */
  .setup-row{display:flex;gap:8px;margin-top:8px;}
  input[type=text],input[type=url]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:0.85rem;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--accent-2);outline-offset:1px;}
  details{margin-top:10px;}
  summary{cursor:pointer;font-size:0.8rem;color:var(--accent);}
  .howto{font-size:0.8rem;color:var(--text-dim);line-height:1.6;margin-top:8px;padding-left:18px;}
  .howto li{margin-bottom:2px;}
  .status-line{font-size:0.78rem;color:var(--text-dim);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;}

  /* dropzone */
  .dropzone{
    border:1.5px dashed var(--border);
    border-radius:12px;
    padding:26px 14px;
    text-align:center;
    color:var(--text-dim);
    font-size:0.85rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{border-color:var(--accent);background:rgba(155,140,242,0.06);}
  .dropzone strong{color:var(--text);}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
  }
  .thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:10px;
    overflow:hidden;
    background:var(--surface-2);
    border:1px solid var(--border);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .noimg{
    display:flex;align-items:center;justify-content:center;
    height:100%;font-size:0.7rem;color:var(--text-dim);padding:6px;text-align:center;
  }
  .badge{
    position:absolute;bottom:5px;right:5px;
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.7rem;font-weight:700;
    background:rgba(20,21,28,0.85);
  }
  .badge.pending{color:var(--text-dim);}
  .badge.uploading{color:var(--accent);}
  .badge.done{color:var(--success);}
  .badge.error{color:var(--error);}
  .spin{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .actions-row{display:flex;gap:8px;margin-top:14px;}
  .actions-row button{flex:1;}

  .links-box{
    margin-top:12px;
    background:var(--surface-2);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.72rem;
    color:var(--text-dim);
    max-height:120px;
    overflow-y:auto;
    word-break:break-all;
    line-height:1.6;
  }
  .links-box a{color:var(--accent);text-decoration:none;}

  .toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);
    padding:9px 16px;border-radius:20px;font-size:0.8rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  .empty-hint{font-size:0.75rem;color:var(--text-dim);text-align:center;padding:6px 0 2px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Envio rápido — VRChat no GeForce Now</h1>
    <p class="sub">Selecione as fotos direto da pasta do GeForce Now e elas vão pro seu Discord na hora. Sem OneDrive, sem login toda vez.</p>
  </header>

  <div class="card timer-card">
    <div>
      <div class="timer-label">Sessão GeForce Now</div>
      <div class="timer-display" id="timerDisplay">60:00</div>
    </div>
    <div class="timer-actions">
      <button class="btn-ghost btn-sm" id="timerStart">Iniciar</button>
      <button class="btn-ghost btn-sm" id="timerReset">Zerar</button>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <label id="dropzone" class="dropzone" for="fileInput">
      <strong>Toque para escolher fotos</strong><br>
      ou arraste aqui (múltiplas de uma vez)
    </label>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">

    <div class="grid" id="grid"></div>
    <p class="empty-hint" id="emptyHint">Nenhuma foto selecionada ainda.</p>

    <div class="actions-row" id="actionsRow" style="display:none;">
      <button class="btn-accent" id="uploadAllBtn">Enviar todas</button>
      <button class="btn-ghost" id="clearBtn">Limpar</button>
    </div>


    <div class="links-box" id="linksBox" style="display:none;"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const toastEl = $('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

/* ---------- timer ---------- */
let timerSeconds = 60*60;
let timerInterval = null;
function renderTimer(){
  const m = Math.floor(timerSeconds/60).toString().padStart(2,'0');
  const s = (timerSeconds%60).toString().padStart(2,'0');
  $('timerDisplay').textContent = `${m}:${s}`;
  $('timerDisplay').classList.toggle('warn', timerSeconds<=600 && timerSeconds>120);
  $('timerDisplay').classList.toggle('danger', timerSeconds<=120);
}
$('timerStart').addEventListener('click', ()=>{
  if(timerInterval){
    clearInterval(timerInterval); timerInterval=null;
    $('timerStart').textContent='Iniciar';
    return;
  }
  $('timerStart').textContent='Pausar';
  timerInterval = setInterval(()=>{
    timerSeconds = Math.max(0, timerSeconds-1);
    renderTimer();
    if(timerSeconds===0){ clearInterval(timerInterval); timerInterval=null; toast('Tempo da sessão esgotado!'); }
  },1000);
});
$('timerReset').addEventListener('click', ()=>{
  clearInterval(timerInterval); timerInterval=null;
  timerSeconds=60*60; $('timerStart').textContent='Iniciar'; renderTimer();
});
renderTimer();

/* ---------- webhook (embutido — sem login, sem setup) ---------- */
const webhookUrl = "https://discord.com/api/webhooks/1549277048453992538/iexcSRXq5wGJSDQpZEliJj4fHj2M1HdiuFHOt0712WMhPXm-H-RhcDJwyEe48WjoeQ7q";

/* ---------- file handling ---------- */
let items = []; // {id, file, status, url, error, previewUrl}
let idSeq = 0;

const dropzone = $('dropzone');
['dragenter','dragover'].forEach(ev=>{
  dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
});
['dragleave','drop'].forEach(ev=>{
  dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.remove('drag'); });
});
dropzone.addEventListener('drop', e=>{
  addFiles(e.dataTransfer.files);
});
$('fileInput').addEventListener('change', e=>{
  addFiles(e.target.files);
  e.target.value = '';
});

function addFiles(fileList){
  const arr = Array.from(fileList);
  arr.forEach(file=>{
    const id = 'f'+(idSeq++);
    const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
    items.push({id, file, status:'pending', url:null, error:null, previewUrl});
  });
  renderGrid();
}

function renderGrid(){
  const grid = $('grid');
  grid.innerHTML = '';
  $('emptyHint').style.display = items.length ? 'none' : 'block';
  $('actionsRow').style.display = items.length ? 'flex' : 'none';

  items.forEach(it=>{
    const div = document.createElement('div');
    div.className='thumb';
    if(it.previewUrl){
      div.innerHTML = `<img src="${it.previewUrl}">`;
    } else {
      div.innerHTML = `<div class="noimg">${escapeHtml(it.file.name)}</div>`;
    }
    const badge = document.createElement('div');
    badge.className = 'badge ' + it.status;
    badge.innerHTML = badgeIcon(it.status);
    div.appendChild(badge);
    grid.appendChild(div);
  });

  renderLinks();
  renderErrors();
}
function badgeIcon(status){
  if(status==='pending') return '·';
  if(status==='uploading') return '<span class="spin">↻</span>';
  if(status==='done') return '✓';
  if(status==='error') return '!';
  return '';
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('clearBtn').addEventListener('click', ()=>{
  items = [];
  renderGrid();
  $('linksBox').style.display='none';
});

/* ---------- upload ---------- */
$('uploadAllBtn').addEventListener('click', uploadAll);

async function uploadAll(){
  if(!webhookUrl){ toast('Configure o webhook primeiro'); return; }
  const pending = items.filter(it=> it.status==='pending' || it.status==='error');
  if(!pending.length){ toast('Nada pra enviar'); return; }

  $('uploadAllBtn').disabled = true;
  $('uploadAllBtn').textContent = 'Enviando...';

  const concurrency = 3;
  let idx = 0;
  async function worker(){
    while(idx < pending.length){
      const it = pending[idx++];
      it.status = 'uploading';
      renderGrid();
      try{
        const url = await uploadOne(it.file);
        it.status = 'done';
        it.url = url;
      }catch(e){
        it.status = 'error';
        it.error = e.message;
      }
      renderGrid();
    }
  }
  await Promise.all(Array.from({length:concurrency}, worker));

  $('uploadAllBtn').disabled = false;
  $('uploadAllBtn').textContent = 'Enviar todas';

  const done = items.filter(i=>i.status==='done').length;
  const failed = items.filter(i=>i.status==='error').length;
  if(failed===0){
    toast(`${done} foto(s) enviada(s) com sucesso`);
  }else{
    toast(`${done} enviada(s), ${failed} falharam`);
  }
}

async function uploadOne(file){
  const form = new FormData();
  form.append('file', file, file.name);
  const target = webhookUrl + (webhookUrl.includes('?') ? '&' : '?') + 'wait=true';
  let res;
  try{
    res = await fetch(target, { method:'POST', body: form });
  }catch(networkErr){
    throw new Error('Bloqueado pela sandbox do artifact ou sem conexão (Failed to fetch)');
  }
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); }catch(e){}
    if(res.status === 413 || res.status === 400){
      throw new Error('Rejeitado pelo Discord ('+res.status+'): '+detail.slice(0,120));
    }
    if(res.status === 404){
      throw new Error('Webhook não encontrado (404) — pode ter sido apagado ou a URL está errada');
    }
    throw new Error('Falha no envio ('+res.status+'): '+detail.slice(0,120));
  }
  const data = await res.json();
  const att = data && data.attachments && data.attachments[0];
  return att ? att.url : null;
}

function renderErrors(){
  const failed = items.filter(i=>i.status==='error');
  let box = $('errorsBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'errorsBox';
    box.className = 'links-box';
    box.style.borderColor = 'var(--error)';
    $('linksBox').insertAdjacentElement('afterend', box);
  }
  if(!failed.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.style.color = 'var(--error)';
  box.innerHTML = failed.map(i=>`<strong>${escapeHtml(i.file.name)}</strong>: ${escapeHtml(i.error||'erro desconhecido')}`).join('<br><br>');
}

function renderLinks(){
  const done = items.filter(i=>i.status==='done' && i.url);
  const box = $('linksBox');
  if(!done.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = done.map(i=>`<a href="${i.url}" target="_blank">${escapeHtml(i.file.name)}</a>`).join('<br>');
}
</script>
</body>
</html>
