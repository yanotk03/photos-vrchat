<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRChat → Discord</title>
<style>
  :root{
    --bg:#0e0f16;
    --surface:#1c1e28;
    --surface-2:#262838;
    --border:#34374a;
    --text:#e9e8f2;
    --text-dim:#9497ad;
    --accent:#9b8cf2;
    --accent-2:#7a6bd9;
    --success:#4ade80;
    --error:#f87171;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* header */
  header{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;flex-shrink:0;
  }
  header h1{font-size:0.95rem;margin:0;font-weight:650;}
  header .status{font-size:0.72rem;color:var(--success);display:flex;align-items:center;gap:4px;}
  header .status .dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;}

  /* messages */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-size:0.85rem;
    line-height:1.6;
    max-width:220px;
  }
  .empty-state .big{font-size:2rem;margin-bottom:6px;}

  .row{display:flex;}
  .row.sent{justify-content:flex-end;}

  .bubble{
    max-width:72%;
    border-radius:16px 16px 4px 16px;
    background:var(--accent);
    color:#171430;
    padding:7px;
    position:relative;
  }
  .bubble.text{
    padding:9px 13px;
    font-size:0.88rem;
    line-height:1.4;
    border-radius:16px 16px 4px 16px;
  }
  .bubble img{
    display:block;
    max-width:100%;
    max-height:260px;
    border-radius:10px;
    object-fit:cover;
  }
  .bubble .filename{
    font-size:0.7rem;
    padding:6px 4px 2px;
    opacity:0.85;
    word-break:break-all;
  }
  .meta{
    font-size:0.65rem;
    opacity:0.8;
    margin-top:3px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
    padding-right:2px;
  }
  .meta.text-meta{color:rgba(23,20,48,0.7);}
  .meta.img-meta{color:rgba(255,255,255,0.9);}

  .check{font-size:0.75rem;}
  .check.pending{opacity:0.6;}
  .check.error{color:#5c1c1c;font-weight:700;}
  .spin{display:inline-block;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .err-note{
    font-size:0.68rem;
    color:#5c1c1c;
    background:rgba(0,0,0,0.12);
    border-radius:8px;
    padding:5px 8px;
    margin-top:4px;
  }
  .retry-btn{
    background:rgba(0,0,0,0.15);
    border:none;
    border-radius:6px;
    color:#171430;
    font-size:0.65rem;
    padding:3px 7px;
    margin-top:4px;
    cursor:pointer;
    font-weight:600;
  }

  /* composer */
  .composer{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:var(--surface);
    border-top:1px solid var(--border);
  }
  .clip-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;
    color:var(--text-dim);
    cursor:pointer;
    flex-shrink:0;
    transform:rotate(45deg);
  }
  .clip-btn:active{transform:rotate(45deg) scale(0.92);}
  .text-input{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:20px;
    padding:10px 15px;
    color:var(--text);
    font-size:0.88rem;
    font-family:inherit;
    outline:none;
  }
  .text-input:focus{border-color:var(--accent-2);}
  .send-btn{
    background:var(--accent);
    border:none;
    border-radius:50%;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    color:#171430;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:active{transform:scale(0.92);}
  .send-btn:disabled{opacity:0.4;}

  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);
    padding:8px 16px;border-radius:20px;font-size:0.78rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    z-index:10;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="avatar">📷</div>
  <div style="flex:1;">
    <h1>Fotos VRChat</h1>
    <div class="status"><span class="dot"></span> conectado ao Discord</div>
  </div>
</header>

<div class="messages" id="messages">
  <div class="empty-state" id="emptyState">
    <div class="big">👋</div>
    Toque no clipe pra mandar suas fotos do VRChat direto pro Discord.
  </div>
</div>

<div class="composer">
  <button class="clip-btn" id="clipBtn" title="Anexar fotos">📎</button>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
  <input type="text" class="text-input" id="textInput" placeholder="Escreva uma mensagem...">
  <button class="send-btn" id="sendBtn">➤</button>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const webhookUrl = "https://discord.com/api/webhooks/1549277048453992538/iexcSRXq5wGJSDQpZEliJj4fHj2M1HdiuFHOt0712WMhPXm-H-RhcDJwyEe48WjoeQ7q";

const messagesEl = $('messages');
const emptyState = $('emptyState');

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function scrollDown(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function nowLabel(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function hideEmptyState(){
  if(emptyState) emptyState.style.display='none';
}

/* ---------- image messages ---------- */
let pendingImages = []; // {file, meta, bubble}

function addImageMessage(file){
  hideEmptyState();
  const row = document.createElement('div');
  row.className='row sent';
  const bubble = document.createElement('div');
  bubble.className='bubble queued';
  bubble.style.opacity='0.55';

  const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
  if(previewUrl){
    const img = document.createElement('img');
    img.src = previewUrl;
    bubble.appendChild(img);
  } else {
    const fn = document.createElement('div');
    fn.className='filename';
    fn.textContent = '🎞️ ' + file.name;
    bubble.appendChild(fn);
  }

  const meta = document.createElement('div');
  meta.className='meta img-meta';
  meta.innerHTML = `<span class="time">na fila</span> <span class="check pending">·</span>`;
  bubble.appendChild(meta);

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();
  updateSendCount();

  pendingImages.push({file, meta, bubble});
}

function updateSendCount(){
  const n = pendingImages.length;
  $('sendBtn').textContent = n > 0 ? ('➤ '+n) : '➤';
}

async function sendAllPending(){
  const batch = pendingImages;
  pendingImages = [];
  updateSendCount();
  batch.forEach(({file, meta, bubble})=>{
    bubble.style.opacity='1';
    meta.querySelector('.time').textContent = nowLabel();
    uploadFile(file, meta, bubble);
  });
}

async function uploadFile(file, meta, bubble){
  const checkEl = meta.querySelector('.check');
  checkEl.className = 'check';
  checkEl.innerHTML = '<span class="spin">↻</span>';

  const form = new FormData();
  form.append('file', file, file.name);
  const target = webhookUrl + (webhookUrl.includes('?') ? '&' : '?') + 'wait=true';

  try{
    const res = await fetch(target, { method:'POST', body: form });
    if(!res.ok){
      let detail='';
      try{ detail = await res.text(); }catch(e){}
      throw new Error('Falha ('+res.status+'): '+detail.slice(0,100));
    }
    checkEl.className = 'check';
    checkEl.textContent = '✓✓';
  }catch(err){
    checkEl.className = 'check error';
    checkEl.textContent = '!';
    const note = document.createElement('div');
    note.className = 'err-note';
    note.textContent = err.message;
    bubble.appendChild(note);
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.textContent = 'Tentar de novo';
    retry.onclick = ()=>{ note.remove(); retry.remove(); uploadFile(file, meta, bubble); };
    bubble.appendChild(retry);
    toast('Falha ao enviar '+file.name);
  }
}

/* ---------- text messages ---------- */
async function sendTextMessage(text){
  hideEmptyState();
  const row = document.createElement('div');
  row.className='row sent';
  const bubble = document.createElement('div');
  bubble.className='bubble text';
  bubble.textContent = text;
  const meta = document.createElement('div');
  meta.className='meta text-meta';
  meta.innerHTML = `<span class="time">${nowLabel()}</span> <span class="check pending">·</span>`;
  bubble.appendChild(meta);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();

  const checkEl = meta.querySelector('.check');
  checkEl.innerHTML = '<span class="spin">↻</span>';
  try{
    const res = await fetch(webhookUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    });
    if(!res.ok) throw new Error('Falha ('+res.status+')');
    checkEl.className='check';
    checkEl.textContent='✓✓';
  }catch(err){
    checkEl.className='check error';
    checkEl.textContent='!';
    toast('Falha ao enviar mensagem');
  }
}

/* ---------- composer wiring ---------- */
$('clipBtn').addEventListener('click', ()=> $('fileInput').click());
$('fileInput').addEventListener('change', e=>{
  Array.from(e.target.files).forEach(addImageMessage);
  e.target.value = '';
});

function trySendAll(){
  const val = $('textInput').value.trim();
  const hasImages = pendingImages.length > 0;
  if(!val && !hasImages){ toast('Nada pra enviar ainda'); return; }
  if(hasImages) sendAllPending();
  if(val){ sendTextMessage(val); $('textInput').value=''; }
}
$('sendBtn').addEventListener('click', trySendAll);
$('textInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') trySendAll();
});
</script>
</body>
</html>
